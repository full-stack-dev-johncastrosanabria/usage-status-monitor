[project]
name = "usage-monitor"
version = "0.2.1"
description = "How much is left on your AI accounts (Claude, ChatGPT/Codex, Antigravity, DeepSeek), with alerts and account switching."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []  # standard library only
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
usage = "usage_monitor.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usage_monitor"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]  # plans and specs quote code; they are not code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "BLE", "A", "C4", "PL"]
ignore = ["PLR2004", "PLR0913", "PLC0415", "RUF001", "RUF002", "RUF003"]  # magic numbers in tests; non-ASCII text in translations

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
