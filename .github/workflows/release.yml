name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  macos:
    needs: test
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]  # arm64, x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Use Xcode 26 (Liquid Glass needs the macOS 26 SDK)
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode" && xcodebuild -version
      - name: Import the Developer ID certificate (skipped until the secrets exist)
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        if: env.CERT_P12 != ''
        run: |
          kc="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p ci "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p ci "$kc"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application.*\)"/\1/p' | head -1)
          echo "MACOS_SIGN_IDENTITY=$id" >> "$GITHUB_ENV"
      - run: scripts/package-macos.sh
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with: { name: "macos-${{ matrix.runner }}", path: dist/macos/*.dmg }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: sh scripts/build-standalone.sh
        shell: bash
      - name: Package the app with the backend
        shell: pwsh
        run: |
          scripts/build-windows.ps1 -Runtime win-x64 -Backend dist/standalone/usage
          $v = (Select-String -Path pyproject.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          Compress-Archive -Path dist/windows/win-x64/* -DestinationPath "dist/windows/UsageMonitor-$v-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/windows/*.zip }

  linux:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get install -y dpkg-dev
      - run: scripts/build-deb.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/linux/*.deb }

  publish:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: cd out && sha256sum * > SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-rc*) flags="--prerelease" ;; esac
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes $flags

  cask:
    needs: publish
    # Pushing to another repo needs a token with contents:write on the tap; skipped for release candidates.
    if: ${{ !contains(github.ref_name, '-rc') }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "::warning::HOMEBREW_TAP_TOKEN is not set, the Homebrew cask was not updated"; exit 0; fi
          v="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS.txt
          arm=$(awk "/-$v-arm64.dmg/{print \$1}" SHA256SUMS.txt)
          intel=$(awk "/-$v-x86_64.dmg/{print \$1}" SHA256SUMS.txt)
          [ -n "$arm" ] && [ -n "$intel" ]
          git clone "https://x-access-token:$TAP_TOKEN@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          f=tap/Casks/usage-monitor.rb
          sed -i -E "s/^(  version \")[^\"]*/\1$v/; s/(arm: +\")[0-9a-f]{64}/\1$arm/; s/(intel: \")[0-9a-f]{64}/\1$intel/" "$f"
          cd tap
          git diff --quiet && { echo "cask already at $v"; exit 0; }
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -am "usage-monitor $v"
          git push
