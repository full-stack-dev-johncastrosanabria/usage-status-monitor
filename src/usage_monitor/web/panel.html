<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>usage-monitor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0d0c'/%3E%3Cpath d='M3.5 4.5 7 8l-3.5 3.5M8.5 11.5h4' fill='none' stroke='%233fd07a' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
  /* An operator console: near-monochrome, one phosphor-green accent, tabular data, thin rules.
     Dark only: it sits next to terminals and editors, usually for hours. */
  :root {
    --bg: #0b0d0c; --surface: #101312; --raised: #151917;
    --line: #1f2523; --line-strong: #2e3633;
    --text: #c8d1cc; --dim: #8a958f;
    --accent: #3fd07a; --accent-ink: #06130b; --accent-wash: rgba(63, 208, 122, .07);
    --ok: #3fd07a; --warn: #d9a441; --bad: #e5534b; --bad-wash: rgba(229, 83, 75, .08);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); scrollbar-color: var(--line-strong) var(--bg); }
  body { margin: 0; color: var(--text); font: 13px/1.5 var(--mono); font-variant-numeric: tabular-nums; caret-color: var(--accent); }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 20px 48px; }

  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between;
           padding-bottom: 14px; border-bottom: 1px solid var(--line-strong); }
  h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .01em; color: #e6ece8; }
  h1 small { margin-left: 10px; padding: 1px 6px; font-size: 10px; font-weight: 400; letter-spacing: .08em; text-transform: uppercase;
             color: var(--warn); border: 1px solid currentColor; }
  .status { margin-top: 4px; color: var(--dim); font-size: 12px; }
  .dot { display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: var(--ok); }
  .status.down { color: var(--bad); }
  .status.down .dot { background: var(--bad); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tools .opts { margin-right: 8px; }

  button { font: inherit; font-size: 12px; color: var(--text); background: transparent; border: 1px solid var(--line-strong);
           border-radius: 2px; padding: 5px 12px; cursor: pointer; transition: background-color .15s, color .15s, border-color .15s; }
  button:hover:not(:disabled) { border-color: var(--dim); background: var(--raised); }
  button:active:not(:disabled) { background: var(--line); }
  button:disabled { color: var(--dim); border-color: var(--line); cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { color: var(--accent); border-color: var(--accent); }
  button.primary:hover:not(:disabled) { color: var(--accent-ink); background: var(--accent); }
  button.primary:disabled { color: var(--dim); border-color: var(--line); }

  /* A row of words; the chosen one is marked. Used for model, effort, auto-switch and language. */
  .opts { display: flex; flex-wrap: wrap; gap: 4px; }
  .opts button { padding: 3px 9px; color: var(--dim); border-color: transparent; }
  .opts button:hover:not(:disabled) { color: var(--text); border-color: var(--line-strong); background: transparent; }
  .opts button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-wash); }

  .under { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--dim); }
  .alert { display: none; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between;
           margin-top: 16px; padding: 10px 14px; border: 1px solid var(--bad); background: var(--bad-wash); }
  .alert.show { display: flex; }
  .alert strong { font-weight: 600; color: var(--bad); }

  h2 { margin: 30px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  h2 small { margin-left: 10px; font-size: 11px; font-weight: 400; letter-spacing: 0; text-transform: none; }

  .scroll { overflow-x: auto; border: 1px solid var(--line); background: var(--surface); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 14px; text-align: left; vertical-align: top; white-space: nowrap; }
  th { padding-top: 7px; padding-bottom: 7px; font-size: 11px; font-weight: 400; letter-spacing: .08em; text-transform: uppercase;
       color: var(--dim); border-bottom: 1px solid var(--line-strong); }
  tbody tr + tr td { border-top: 1px solid var(--line); }
  tbody tr.sub td { border-top-color: transparent; padding-top: 0; }
  tr.current td { background: var(--accent-wash); }
  td.num, th.num { width: 1%; padding-right: 4px; color: var(--dim); }
  tr.current td.num { color: var(--accent); font-weight: 600; }
  td.who { max-width: 300px; }
  .name { display: block; overflow: hidden; text-overflow: ellipsis; color: #e6ece8; }
  .note { margin-left: 10px; color: var(--dim); font-size: 12px; }
  .tag { display: inline-block; margin: 3px 6px 0 0; padding: 0 6px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
         color: var(--dim); border: 1px solid var(--line-strong); }
  .tag.on { color: var(--accent); border-color: var(--accent); }
  td.plan { color: var(--dim); }
  td.act, th.act { width: 1%; text-align: right; }
  tr.group td { padding-bottom: 0; }
  tr.group + tr td { border-top-color: transparent; }

  .meter { display: flex; align-items: center; gap: 10px; }
  .pct { min-width: 4ch; text-align: right; font-weight: 600; }
  .bar { flex: none; width: 84px; height: 6px; background: var(--line);
         -webkit-mask: repeating-linear-gradient(90deg, #000 0 7px, transparent 7px 8.4px); mask: repeating-linear-gradient(90deg, #000 0 7px, transparent 7px 8.4px); }
  .bar i { display: block; height: 100%; background: currentColor; transition: width .2s ease-out; }
  .when { margin-top: 2px; padding-left: calc(4ch + 10px); color: var(--dim); font-size: 12px; }
  .ok .pct, .ok .bar { color: var(--ok); } .warn .pct, .warn .bar { color: var(--warn); } .bad .pct, .bad .bar { color: var(--bad); }
  .money { display: block; font-weight: 600; color: var(--ok); }
  .money.bad { color: var(--bad); }
  .err { color: var(--bad); white-space: normal; }
  .empty { padding: 14px; color: var(--dim); }

  dl { margin: 0; border: 1px solid var(--line); background: var(--surface); }
  dl > div { display: grid; grid-template-columns: 130px 1fr; gap: 4px 14px; align-items: baseline; padding: 8px 14px; }
  dl > div + div { border-top: 1px solid var(--line); }
  dt { color: var(--dim); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  dd { margin: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
  .hint { color: var(--dim); font-size: 12px; }

  .toast { position: fixed; left: 50%; bottom: 20px; max-width: calc(100% - 32px); padding: 8px 14px; font-size: 12px;
           color: var(--text); background: var(--raised); border: 1px solid var(--line-strong);
           transform: translate(-50%, 8px); opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s ease-out; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Compact: a small window keeps one line per account, with its tightest limit. */
  @media (max-width: 620px) {
    main { padding: 12px 12px 24px; }
    header { padding-bottom: 10px; gap: 8px; }
    .status, .tools .opts, #refresh, #defaults, h2 small, .when, .tag:not(.on), .note { display: none; }
    table { table-layout: fixed; }
    th.num, td.num { width: 30px; }
    th.free, td.free { width: 112px; }
    h2 { margin: 18px 0 6px; }
    th, td { padding: 7px 10px; overflow: hidden; text-overflow: ellipsis; }
    td.who { max-width: none; }
    .bar { width: 44px; }
    .meter { justify-content: flex-end; }
    tr[data-n] { cursor: pointer; }
    tr[data-n]:hover td { background: var(--raised); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>usage-monitor<small id="demo" hidden></small></h1>
      <div class="status" id="status"><span class="dot"></span>…</div>
    </div>
    <div class="tools">
      <div class="opts" id="lang" role="group" aria-label="Language"></div>
      <button id="refresh" type="button"></button>
      <button id="switchBest" class="primary" type="button" disabled></button>
    </div>
  </header>

  <div class="alert" id="alert" role="alert"></div>

  <h2><span id="hAccounts"></span><small id="hAccountsHint"></small></h2>
  <div class="scroll" id="accounts"></div>
  <div class="under"><button id="connect" type="button"></button><span id="connectState" role="status"></span></div>

  <h2 id="hProviders"></h2>
  <div class="scroll" id="providers"></div>

  <section id="defaults">
    <h2><span id="hDefaults"></span><small id="hDefaultsHint"></small></h2>
    <dl id="settings"></dl>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const HEADERS = { "Content-Type": "application/json", "X-Usage-Monitor": "1" };
let data = null;
let lang = "en";
const compact = matchMedia("(max-width: 620px)");  // a small window shows one line per account

const T = (key, vars = {}) => (I18N[lang][key] ?? I18N.en[key]).replace(/\{(\w+)\}/g, (_, k) => vars[k]);
const tone = (free) => free > 50 ? "ok" : free > 20 ? "warn" : "bad";

function countdown(iso) {
  if (!iso) return "";
  const d = new Date(iso), s = Math.max(0, (d - Date.now()) / 1000);
  const days = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  const left = days ? `${days}${T("d")} ${h}${T("h")}` : h ? `${h}${T("h")} ${m}${T("min")}` : `${m}${T("min")}`;
  const when = d.toLocaleString(lang === "zh" ? "zh-CN" : lang, { weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false });
  return T("resetsIn", { left, when });
}

const meter = (free) => `<div class="meter"><span class="pct">${Math.round(free)}%</span>
  <span class="bar" role="img" aria-label="${T("freeAria", { p: Math.round(free) })}"><i style="width:${free}%"></i></span></div>`;
const cell = (r, cls) => r ? `<td class="${cls} ${tone(r.free)}">${meter(r.free)}<div class="when">${esc(countdown(r.reset))}</div></td>` : `<td class="${cls}"></td>`;
const tag = (text, on) => `<span class="tag ${on ? "on" : ""}">${esc(text)}</span>`;

function accountsTable() {
  if (!data.claude.length) return `<div class="empty">${esc(T("noSessions"))}</div>`;
  const labels = [];
  data.claude.forEach((c) => (c.rows || []).forEach((r) => labels.includes(r.label) || labels.push(r.label)));
  const head = `<tr><th class="num">#</th><th>${T("colAccount")}</th>` + (compact.matches ? `<th class="free">${T("colFree")}</th>`
    : `<th class="plan">${T("colPlan")}</th>` + labels.map((l) => `<th>${esc(l)}</th>`).join("") + `<th class="act"></th>`) + `</tr>`;
  const rows = data.claude.map((c) => {
    const tags = (c.current ? tag(T("tagActive"), true) : "") + (c.n === data.best ? tag(T("tagBest")) : "");
    const wins = c.error ? `<td class="err" colspan="${labels.length || 1}">${esc(c.error)}</td>`
                         : labels.map((l) => cell(c.rows.find((r) => r.label === l), "")).join("");
    const score = c.error ? `<td class="free err">${T("failed")}</td>` : `<td class="free ${tone(c.score)}">${meter(c.score)}</td>`;
    const act = c.current ? "" : `<button type="button" data-n="${c.n}">${T("use")}</button>`;
    const rest = compact.matches ? score : `<td class="plan">${esc(c.plan || "")}</td>${wins}<td class="act">${act}</td>`;
    return `<tr class="${c.current ? "current" : ""}" ${c.current ? "" : `data-n="${c.n}"`}>
      <td class="num">${c.n}</td>
      <td class="who"><span class="name" title="${esc(c.email)}">${esc(c.email)}</span>${tags}</td>
      ${rest}</tr>`;
  }).join("");
  return `<table><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}

// One row per limit. Full width: the source is a column, named once. Compact: the source is a group row.
function providerRows(source, note, usage, labelOf = (r) => r.label) {
  const name = `<span class="name" title="${esc(note)}">${esc(source)}<span class="note">${esc(note)}</span></span>`;
  const lead = (first) => compact.matches ? "" : `<td class="who">${first ? name : ""}</td>`;
  const group = compact.matches ? `<tr class="group"><td colspan="2">${name}</td></tr>` : "";
  if (usage.error) return group + `<tr>${lead(true)}<td class="err" colspan="${compact.matches ? 2 : 3}">${esc(usage.error)}</td></tr>`;
  if (usage.balances) return group + usage.balances.map((b, i) => `<tr class="${i ? "sub" : ""}">${lead(!i)}<td>${T("balance")}</td>
    <td class="free"><span class="money ${usage.available ? "" : "bad"}">${b.total.toFixed(2)} ${esc(b.currency)}</span></td>` + (compact.matches ? "" :
    `<td>${esc(usage.available ? `${T("toppedUp", { v: b.topped_up.toFixed(2) })} · ${T("granted", { v: b.granted.toFixed(2) })}` : T("noBalance"))}</td>`) + `</tr>`).join("");
  return group + usage.rows.map((r, i) => `<tr class="${i ? "sub" : ""}">${lead(!i)}<td>${esc(labelOf(r))}</td>
    <td class="free ${tone(r.free)}">${meter(r.free)}</td>` + (compact.matches ? "" : `<td>${esc(countdown(r.reset))}</td>`) + `</tr>`).join("");
}

function providersTable() {
  const head = compact.matches ? `<th>${T("colLimit")}</th><th class="free">${T("colFree")}</th>`
    : `<th>${T("colSource")}</th><th>${T("colLimit")}</th><th>${T("colFree")}</th><th>${T("colResets")}</th>`;
  return `<table><thead><tr>${head}</tr></thead><tbody>` +
    providerRows("ChatGPT / Codex", data.codex.plan || "", data.codex) +
    providerRows("Antigravity", data.antigravity.plan || "", data.antigravity, (r) => `${r.group} · ${r.label}`) +
    (data.copilot ? providerRows("GitHub Copilot", data.copilot.plan || "", data.copilot) : "") +
    providerRows("DeepSeek API", "", data.deepseek) + `</tbody></table>`;
}

// items: [{id, label}]
const options = (name, items, active) => `<div class="opts" role="group" aria-label="${esc(name)}">` + items.map((m) =>
  `<button type="button" data-set="${name}" data-value="${esc(m.id)}" aria-pressed="${m.id === active}">${esc(m.label)}</button>`).join("") + `</div>`;
const line = (term, body) => `<div><dt>${esc(term)}</dt><dd>${body}</dd></div>`;

function settingsList() {
  const s = data.settings || {};
  const auto = line(T("autoSwitch"), `<div class="opts" role="group" aria-label="${esc(T("autoSwitch"))}">` +
    [true, false].map((v) => `<button type="button" data-auto="${v}" aria-pressed="${v === data.auto_switch}">${T(v ? "on" : "off")}</button>`).join("") +
    `</div><span class="hint">${esc(T("autoHint", { p: data.alert_at }))}</span>`);
  if (s.error) return line(T("model"), `<span class="err">${esc(s.error)}</span>`) + auto;
  return line(T("model"), options("model", s.models.filter((m) => !m.more), s.model)) +
    line(T("moreModels"), options("model", s.models.filter((m) => m.more), s.model)) +
    line(T("effort"), options("effort", s.efforts.map((e) => ({ id: e, label: e })), s.effort) + `<span class="hint">${esc(T("effortHint"))}</span>`) + auto;
}

function render() {
  lang = I18N[data.lang] ? data.lang : "en";
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  const best = data.claude.find((c) => c.n === data.best);
  const cur = data.claude.find((c) => c.current);

  $("demo").hidden = !data.demo;
  $("demo").textContent = T("demo");
  $("lang").innerHTML = Object.entries(data.languages).map(([code, name]) =>
    `<button type="button" data-lang="${code}" aria-pressed="${code === lang}">${esc(name)}</button>`).join("");
  $("refresh").textContent = T("refresh");
  $("hAccounts").textContent = T("secAccounts");
  $("hAccountsHint").textContent = T("freeHint");
  const c = data.connect || { status: "idle" };
  $("connect").textContent = T("connect");
  $("connect").disabled = c.status === "waiting" || data.demo;
  $("connectState").textContent = {
    waiting: T("connectWaiting"), cancelled: T("connectCancelled"),
    connected: T("connectDone", { n: c.number, email: c.email || "" }),
    duplicate: T("connectDup", { n: c.number, email: c.email || "" }),
    failed: T("connectFailed", { error: c.error || "" }),
  }[c.status] || "";
  clearTimeout(render.poll);
  if (c.status === "waiting") render.poll = setTimeout(load, 3000);  // the account appears as soon as it signs in
  $("hProviders").textContent = T("secProviders");
  $("hDefaults").textContent = T("secDefaults");
  $("hDefaultsHint").textContent = T("defaultsHint");

  $("accounts").innerHTML = accountsTable();
  $("providers").innerHTML = providersTable();
  $("settings").innerHTML = settingsList();

  const sb = $("switchBest");
  sb.disabled = !best;
  sb.textContent = best ? T("switchBest", { n: best.n, p: Math.round(best.score) }) : T("noBest");

  const hot = cur && (cur.rows || []).filter((r) => r.blocking && r.used >= data.alert_at).sort((a, b) => b.used - a.used)[0];
  $("alert").classList.toggle("show", Boolean(hot));
  if (hot) $("alert").innerHTML = `<span><strong>${esc(T("alertHead", { n: cur.n, p: Math.round(hot.used), label: hot.label }))}</strong>
    ${best ? T("alertBest", { n: best.n, p: Math.round(best.score) }) : T("alertNone")}</span>` +
    (best ? `<button class="primary" type="button" data-n="${best.n}">${T("alertButton", { n: best.n })}</button>` : "");

  const m = Math.round((Date.now() - new Date(data.updated)) / 60000);
  $("status").className = "status";
  $("status").innerHTML = `<span class="dot"></span>` + esc(`${T("online")} · ` + T("status", { ago: m < 1 ? T("justNow") : T("minAgo", { m }), m: data.every / 60, p: data.alert_at }));
}

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 4500);
}

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: HEADERS, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function load() {
  try { data = await api("/api/data"); render(); }
  catch (e) { $("status").className = "status down"; $("status").innerHTML = `<span class="dot"></span>` + esc(T("offline")); }
}

async function act(path, body, done) {
  try { data = await api(path, body); render(); const msg = done && done(data); if (msg) toast(msg); }
  catch (e) { toast(e.message); }
}

const switched = (d) => { const c = d.claude.find((x) => x.current); return T("toastSwitch", { n: c.n, email: c.email }); };
const modelLabel = (s) => (s.models.find((m) => m.id === s.model) || {}).label || s.model;

document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) {  // in the compact layout the whole account row is the switch control
    const row = compact.matches && e.target.closest("tr[data-n]");
    if (row) act("/api/switch", { n: Number(row.dataset.n) }, switched);
    return;
  }
  if (b.dataset.n) act("/api/switch", { n: Number(b.dataset.n) }, switched);
  else if (b.dataset.set) act("/api/settings", { [b.dataset.set]: b.dataset.value }, (d) => T("toastSettings", { model: modelLabel(d.settings), effort: d.settings.effort }));
  else if (b.dataset.lang) act("/api/prefs", { language: b.dataset.lang });
  else if (b.dataset.auto) act("/api/prefs", { auto_switch: b.dataset.auto === "true" }, (d) => T("toastAuto", { state: T(d.auto_switch ? "on" : "off") }));
});
$("connect").onclick = () => act("/api/connect", {});
$("switchBest").onclick = () => act("/api/switch", {}, switched);
$("refresh").onclick = async () => {
  const b = $("refresh"); b.disabled = true; b.textContent = T("refreshing");
  const before = data && data.updated;
  await act("/api/refresh", {}, (d) => (d.updated === before ? T("upToDate") : null));  // same data: the server skipped the fetch
  b.disabled = false; b.textContent = T("refresh");
};

compact.addEventListener("change", () => data && render());
load();
setInterval(load, 30000);
</script>
</body>
</html>
